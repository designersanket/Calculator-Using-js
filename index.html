<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="container">

    <h1>Simple Calculator</h1>

    <input class="dispace" type="text" id="display" readonly>

    <div class="btn-container">
        <button class="btn" onclick="press('7')">7</button>
        <button class="btn" onclick="press('8')">8</button>
        <button class="btn" onclick="press('9')">9</button>
        <button class="btn" onclick="press('/')">/</button>

        <button class="btn" onclick="press('4')">4</button>
        <button class="btn" onclick="press('5')">5</button>
        <button class="btn" onclick="press('6')">6</button>
        <button class="btn" onclick="press('*')">*</button>

        <button class="btn" onclick="press('1')">1</button>
        <button class="btn" onclick="press('2')">2</button>
        <button class="btn" onclick="press('3')">3</button>
        <button class="btn" onclick="press('-')">-</button>

        <button class="btn" onclick="press('0')">0</button>
        <button class="btn" onclick="press('.')">.</button>
        <button class="btn" onclick="calculate()">=</button>
        <button class="btn" onclick="press('+')">+</button>

        <button class="btn clear" onclick="clearDisplay()">C</button>
    </div>

</div>
    <footer class="footer">Made by Sanket Jagadale &trade;
        <a href="https://github.com/designersanket/Calculator-Using-js" target="_blank">
            <i class="fab fa-github fa-2x"></i>
        </a>
    </footer>

    <script src="/Calculator/index.js"></script>
</body>
</html>
